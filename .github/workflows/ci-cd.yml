name: MediContigo - CI/CD

on:
  push:
    branches:
      - feature/hu-16-despliegue
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Pruebas Backend - Java 25
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Dar permisos a Maven Wrapper
        working-directory: backend
        run: chmod +x mvnw

      - name: Ejecutar pruebas del backend
        working-directory: backend
        run: ./mvnw clean verify --batch-mode

  frontend:
    name: Compilar Frontend - React
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://medicontigo-backend.onrender.com
        run: npm run build

  deploy:
    name: Despliegue a Render
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/hu-16-despliegue'

    steps:
      - name: Desplegar backend
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Hook del backend pendiente de configurar"
            exit 1
          fi
          curl --fail --show-error --silent --retry 3 -X POST "$DEPLOY_HOOK"

      - name: Desplegar frontend
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Hook del frontend pendiente de configurar"
            exit 1
          fi
          curl --fail --show-error --silent --retry 3 -X POST "$DEPLOY_HOOK"

  smoke-tests:
    name: Smoke Tests - Produccion
    runs-on: ubuntu-latest
    needs:
      - deploy
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar backend y PostgreSQL
        shell: pwsh
        env:
          BACKEND_URL: https://medicontigo-backend.onrender.com
        run: |
          $maxIntentos = 30
          $exitoso = $false

          for ($intento = 1; $intento -le $maxIntentos; $intento++) {
              Write-Host "Smoke Test - intento $intento de $maxIntentos"

              try {
                  ./scripts/smoke-test.ps1
                  $exitoso = $true
                  break
              }
              catch {
                  Write-Host "Servicio aun no disponible: $_"
              }

              if ($intento -lt $maxIntentos) {
                  Start-Sleep -Seconds 20
              }
          }

          if (-not $exitoso) {
              throw "SMOKE TESTS FALLIDOS"
          }

      - name: Verificar frontend en produccion
        shell: pwsh
        run: |
          $url = "https://medicontigo-frontend.onrender.com"
          $respuesta = Invoke-WebRequest -Uri $url -TimeoutSec 120

          if ($respuesta.StatusCode -ne 200) {
              throw "Frontend no disponible"
          }

          Write-Host "Frontend disponible - HTTP 200"