spring.application.name=backend
# 1. Credenciales de la Base de Datos (Ejemplo con H2 o MySQL)
spring.datasource.url=jdbc:h2:mem:medicontigodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Desactivar la "magia" automática de Hibernate (El profesor amará esto)
spring.jpa.hibernate.ddl-auto=none

# 3. Forzar al sistema a ejecutar tu script manual (schema.sql)
spring.sql.init.mode=always
server.port=8081
server.error.include-message=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Permitir inicializar la BD con data.sql (Spring Boot 3+)
spring.jpa.defer-datasource-initialization=true

# Los scripts SQL contienen tildes y enes: leerlos siempre como UTF-8
spring.sql.init.encoding=UTF-8

# HU-18: autenticación JWT (roles ADMIN y PACIENTE)
# En producción (HU-16) definir la variable de entorno JWT_SECRETO con un valor propio.
jwt.secreto=${JWT_SECRETO:MiClaveSecretaParaElProyectoDeIngenieriaDeSoftware123}
jwt.expiracion-admin-minutos=30
jwt.expiracion-paciente-minutos=60
