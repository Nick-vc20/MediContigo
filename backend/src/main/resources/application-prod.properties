# HU-16: Configuracion de produccion

# Base de datos PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Inicializacion mediante scripts especificos de produccion
# La base de datos se inicializara por separado.
# Evita ejecutar nuevamente los datos de ejemplo en cada reinicio.
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# Mantener las tablas controladas mediante SQL
spring.jpa.hibernate.ddl-auto=none

# Puerto asignado por el proveedor
server.port=${PORT:8081}

# Dominio autorizado del frontend
app.cors.allowed-origins=${FRONTEND_URL}

# Seguridad
jwt.secreto=${JWT_SECRETO}

# Desactivar consola H2
spring.h2.console.enabled=false

# No exponer detalles internos de errores
server.error.include-message=never
